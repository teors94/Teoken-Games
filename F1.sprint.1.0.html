<style>
:root{--bg:#0b0f14;--hud:#fff;--panel:rgba(10,14,20,.62);--acc:#e10600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0b0f14}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--hud);user-select:none;touch-action:none}
canvas#c{display:block;width:100%;height:100%}
.p{position:absolute;background:var(--panel);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums}
#sp{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:34px;font-weight:700}
#sp small{font-size:13px;opacity:.7;margin-left:4px}
#info{left:12px;top:calc(12px + env(safe-area-inset-top,0px));line-height:1.5;font-size:15px}
#mm{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:4px}
#mm canvas{display:block;width:150px;height:150px}
#big{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
#big b{font-size:min(22vw,150px);line-height:1}
#big span{font-size:18px;margin-top:10px;max-width:80vw}
#msg{pointer-events:auto}
#msg button{margin-top:16px;font:inherit;font-size:18px;padding:10px 22px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
.tb{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;background:var(--panel);display:none;align-items:center;justify-content:center;font-size:28px}
@media (pointer:coarse){.tb{display:flex}#sp{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
#tl{left:14px}#tr{left:94px}#tg{right:14px;background:rgba(20,140,60,.7)}#tbk{right:94px;background:rgba(200,30,30,.7)}
#help{left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.85}
@media (pointer:coarse){#help{display:none}}
#lb{left:12px;top:calc(122px + env(safe-area-inset-top,0px));font-size:13px;line-height:1.5;min-width:150px}#lb i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #fff8}#lb .me{font-weight:700;color:#ffd400}#snd{left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));cursor:pointer;font-size:18px;pointer-events:auto}
#sel{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,10,16,.9);gap:14px;padding:16px;overflow:auto;z-index:5}
#sel h2{margin:0;font-size:22px}

#sel .c{background:#161a22;border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:3px solid transparent;font-size:13px}
#sel .c:hover{border-color:#fff}#sel .c b{display:block;font-size:16px;margin-top:4px}#sel .c span{opacity:.75}
#camb{right:12px;top:calc(176px + env(safe-area-inset-top,0px));cursor:pointer;font-size:18px;pointer-events:auto}
#sel input,#sel select{font:inherit;font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid #444;background:#0f131a;color:#fff;user-select:text;-webkit-user-select:text;touch-action:auto;width:100%;box-sizing:border-box}
#sel input[type=color]{padding:0;height:36px}
.md{display:flex;gap:8px}.md button,.fm .bt button{font:inherit;font-size:16px;padding:8px 18px;border-radius:8px;border:2px solid #444;background:#161a22;color:#fff;cursor:pointer}.md button.on{border-color:#ffd400;background:#2a2410}.fm .bt{text-align:center}
#sel .nt{font-size:13px;opacity:.7;text-align:center}#sel .c em{display:block;font-style:normal;font-size:11px;opacity:.6;margin-top:3px}
#sel .nw{border:3px dashed #555;display:flex;flex-direction:column;align-items:center;justify-content:center}.nw .plus{font-size:44px;line-height:72px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;max-width:720px;width:100%}.fm label{display:flex;flex-direction:column;gap:4px;font-size:13px}.fm .wd{grid-column:1/-1}
.em{display:flex;flex-wrap:wrap;gap:6px}.em button{width:44px;height:44px;font-size:20px;border-radius:8px;border:2px solid #444;background:#161a22;color:#fff;cursor:pointer}.em button.on{border-color:#ffd400}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e14;color:#fff;font:600 20px Arial,sans-serif;z-index:100}
#gp{position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:70;display:flex;gap:8px;align-items:center;background:rgba(8,10,16,.72);border:1px solid #444;border-radius:10px;padding:4px 10px;font:12px Arial,sans-serif;color:#fff;white-space:nowrap;max-width:96vw;overflow:hidden;pointer-events:auto}
#gp button{font:inherit;color:#fff;background:#1c2230;border:1px solid #555;border-radius:8px;padding:3px 8px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:90;background:rgba(8,10,16,.92);border:1px solid #666;border-radius:10px;padding:10px 14px;font:14px Arial,sans-serif;color:#fff;max-width:90vw;display:none}
#adm{position:fixed;inset:0;z-index:80;background:rgba(10,12,18,.97);color:#fff;overflow:auto;padding:16px;font:14px Arial,sans-serif;user-select:text;-webkit-user-select:text;touch-action:auto}

#adm textarea{width:100%;max-width:900px;font-family:monospace}#adm .t{width:220px}#adm .m{width:90px}#adm input[type=checkbox]{width:auto}

#pz{position:fixed;inset:0;z-index:75;background:rgba(8,10,16,.82);color:#fff;display:none;flex-direction:column;gap:12px;align-items:center;justify-content:center;font:16px Arial,sans-serif}#pz button{font:inherit;font-size:18px;padding:10px 26px;min-width:260px;border-radius:10px;border:2px solid #555;background:#1c2230;color:#fff;cursor:pointer}#pz button:hover{border-color:#ffd400}
#nosb{position:fixed;top:44px;left:50%;transform:translateX(-50%);z-index:70;display:none;background:rgba(255,160,0,.92);color:#201000;font:bold 16px Arial,sans-serif;padding:4px 14px;border-radius:10px}
#ced{position:fixed;inset:0;z-index:85;background:rgba(10,12,18,.98);color:#fff;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;font:14px Arial,sans-serif;user-select:text;-webkit-user-select:text}
#ced h2{margin:4px 0}#ctl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:900px}#ced button{font:inherit;padding:6px 10px;border-radius:8px;border:2px solid #444;background:#161a22;color:#fff;cursor:pointer}#ctl button.on{border-color:#ffd400;background:#2a2410}
#cv{max-width:96vw;border:2px solid #444;touch-action:none;cursor:crosshair}#ced input{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #444;background:#0f131a;color:#fff}#cmsg{max-width:700px;text-align:center;min-height:36px}

#ttl{text-align:center;animation:ttIn .9s cubic-bezier(.2,1.3,.4,1) both}#ttl .tk{font:900 italic min(9vw,54px) Arial,sans-serif;color:#e10600;letter-spacing:.25em;text-shadow:3px 3px #000}
#ttl h1{margin:0;font:900 italic min(16vw,104px) Arial,sans-serif;background:linear-gradient(90deg,#fff,#ffd84a 55%,#ff4a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(4px 4px 0 #000);letter-spacing:.04em}
#ttl .sub{font:600 min(4vw,17px) Arial,sans-serif;opacity:.8;letter-spacing:.2em;margin-top:6px}#ttl::after{content:'';display:block;height:10px;margin:12px auto 0;width:70%;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/20px 20px}
.tm{display:flex;flex-direction:column;gap:12px;margin-top:22px;align-items:center}.tm button{font:800 22px Arial,sans-serif;padding:12px 40px;min-width:min(78vw,320px);border-radius:12px;border:2px solid #555;background:linear-gradient(180deg,#1e2433,#12161f);color:#fff;cursor:pointer;letter-spacing:.06em;transition:.15s}.tm button:hover{border-color:#ffd400;transform:scale(1.04)}

const CELLM=130,GWc=14,GHc=9;
const POIK={church:['CHIESA',20,24,14,0xe8dcc0],poste:['POSTE',16,10,8,0xf1e6b8],banca:['BANCA',22,16,16],bar:['BAR',14,9,7,0xe8d9b5],pasticceria:['PASTICCERIA',18,12,9],tim:['TELEFONIA',18,14,10],pompa:['BENZINA',20,16,5],scuola:['SCUOLA',34,22,14],coop:['SUPERMERCATO',20,16,8],fumetti:['FUMETTI',14,10,10],onoranze:['ONORANZE',14,10,9],fornai:['PIAZZA DEI FORNAI',22,20,6],torre:['TORRE',12,12,34]};
function compileCircuit(d){const key=(c,r)=>c+','+r,road=new Set((d.road||[]).map(a=>key(a[0],a[1])));
 if(road.size<8)return{err:'Servono almeno 8 tile di strada.'};
 if(!d.start||!road.has(key(d.start[0],d.start[1])))return{err:'Metti la partenza 🏁 su una tile di strada.'};
 const nb=(c,r)=>[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[c+a,r+b]).filter(q=>road.has(key(q[0],q[1])));
 for(const k of road){const[c,r]=k.split(',').map(Number);if(nb(c,r).length!==2)return{err:'La strada deve essere un anello: ogni tile deve avere esattamente 2 tile vicine (niente incroci né strade interrotte). Controlla la tile '+(c+1)+','+(r+1)+'.'}}
 let path=[d.start.slice()],prev=d.start.slice(),cur=nb(d.start[0],d.start[1])[0];
 while(!(cur[0]===d.start[0]&&cur[1]===d.start[1])&&path.length<=road.size){path.push(cur);const nx=nb(cur[0],cur[1]).find(q=>!(q[0]===prev[0]&&q[1]===prev[1]));prev=cur;cur=nx}
 if(path.length!==road.size)return{err:'Le strade devono formare un unico anello collegato.'};
 if(d.inv)path=[path[0],...path.slice(1).reverse()];
 const n=path.length,P=path.map(([c,r])=>[(c+.5)*CELLM,(r+.5)*CELLM,0]);
 const near=(c,r)=>{let b=-1,bd=1e9;path.forEach((q,i)=>{const dd=Math.hypot(q[0]-c,q[1]-r);if(dd<bd){bd=dd;b=i}});return{i:b,d:bd}};
 const side=(c,r,i)=>{const a=path[(i+1)%n],b=path[(i-1+n)%n],tx=a[0]-b[0],tz=a[1]-b[1],q=path[i];return(-tz*(c-q[0])+tx*(r-q[1]))<0?-1:1};
 const out={err:null,P,name:d.name||'Circuito',pois:[],boards:[],labels:[],stands:[],fountains:[],boxF:null,n};
 (d.items||[]).forEach(it=>{const q=near(it.c,it.r);if(q.d>3.5)return;const f=q.i/n,s=side(it.c,it.r,q.i);
  if(POIK[it.k])out.pois.push({k:it.k,t:it.t,f,s});else if(it.k==='fontana')out.fountains.push({t:it.t,f,s});else if(it.k==='label')out.labels.push({t:it.t,f});else if(it.k==='ad')out.boards.push({t:it.t||'Sponsor',g:(it.c+it.r)%6,f,s});else if(it.k==='tribuna')out.stands.push({f,s})});

 const $=s=>ov.querySelector(s),cv=$('#cv'),g=cv.getContext('2d'),msg=t=>$('#cmsg').textContent=t;$('#cnm').value=nm;
 const ctl=$('#ctl'),sel=()=>ctl.querySelectorAll('button').forEach(b=>b.className=b.dataset.k===tool?'on':'');

  const isR=(c,r)=>R.has(c+','+r);R.forEach(k=>{const[c,r]=k.split(',').map(Number);g.fillStyle='#3b3d44';g.fillRect(c*CS+3,r*CS+3,CS-6,CS-6);g.strokeStyle='#d8d8d8';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{if(isR(c+a,r+b)){g.moveTo(c*CS+CS/2,r*CS+CS/2);g.lineTo(c*CS+CS/2+a*CS/2,r*CS+CS/2+b*CS/2)}});g.stroke();g.setLineDash([])});
  g.textAlign='center';g.textBaseline='middle';IM.forEach((v,k)=>{const[c,r]=k.split(',').map(Number),t=TK.find(x=>x[0]===v.k);g.font='26px Arial';g.fillText(t?t[1]:'?',c*CS+CS/2,r*CS+CS/2-4);if(v.t){g.font='10px Arial';g.fillStyle='#fff';g.fillText(v.t.slice(0,9),c*CS+CS/2,r*CS+CS-7)}});
  g.font='26px Arial';if(start)g.fillText('🏁',start[0]*CS+CS/2,start[1]*CS+CS/2);if(box)g.fillText('🔧',box[0]*CS+CS/2,box[1]*CS+CS/2)};

 const apply=e=>{const q=cell(e);if(!q)return;const[c,r]=q,k=c+','+r;
  if(tool==='road'){R.add(k);IM.delete(k)}else if(tool==='erase'){R.delete(k);IM.delete(k);if(start&&start[0]===c&&start[1]===r)start=null;if(box&&box[0]===c&&box[1]===r)box=null}
  else if(tool==='start'){if(R.has(k))start=[c,r];else msg('La partenza va su una tile di strada.')}else if(tool==='box'){if(R.has(k))box=[c,r];else msg('Il box va su una tile di strada.')}

function champTable(){if(!CH)return'';const me=cars[0].name,rows=Object.entries(CH.pts).sort((a,b)=>b[1]-a[1]).slice(0,10);return'<div style="margin-top:8px;font-size:14px">🏆 Classifica · gara '+(CH.round+1)+'/'+CH.rounds.length+'<br>'+rows.map(([n,p],i)=>'<span style="'+(n===me?'font-weight:800;color:#ffd400':'')+'">'+(i+1)+'. '+n+' — '+p+' pt</span>').join('<br>')+'</div>'}
function finishBtns(){if(GM==='champ'&&CH&&CH.active){const last=CH.round>=CH.rounds.length-1;return last?'<div style="margin:8px 0;font-weight:800">🏆 Campionato concluso!</div><button onclick="fendCh()">Concludi</button>':'<button onclick="fnextCh()">Prossima gara ▶</button> <button onclick="reset();openTitle()">🏠 Menu</button>'}
 return'<button onclick="reset()">Riparti</button> <button onclick="openSelect()">Cambia scuderia</button> <button onclick="reset();openTitle()">🏠 Menu</button>'}
Object.assign(window,{reset,openSelect,openTitle,fnextCh:()=>roundReload(CH.round+1),fendCh:()=>{CH=null;saveCH();reset();openTitle()}});

MODE=BOOTMODE==='kart'?'kart':(REV?'tar':'real');if(PROG.custom){try{CUSTOM=makeCustom(PROG.custom)}catch(e){}}applyRoster();initUI();
try{if(sessionStorage.getItem('f1sgr_skip')==='1'){MODESEL=true;sessionStorage.removeItem('f1sgr_skip')}}catch(e){}
reset();if(CH&&CH.active&&CH.go&&GM==='champ'){CH.go=false;saveCH();MODE=CH.mode;MODESEL=true;applyRoster();chooseTeam(CH.team,true);toast('🏆 Campionato · gara '+(CH.round+1)+' di '+CH.rounds.length)}else openTitle();

const keys={},tc={l:0,r:0,g:0,b:0};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(e.code==='Escape'){if(!document.getElementById('adm'))setPause(!st.paused);return}if(st.paused&&e.code!=='KeyR')return;if(e.code==='KeyR'){if(st.paused)setPause(false);reset()}if(e.code==='KeyC')st.view=(st.view+1)%2;if(e.code==='KeyT'&&st.mode==='done'&&!st.sel)openSelect()});
addEventListener('keyup',e=>keys[e.code]=0);
[['tl','l'],['tr','r'],['tg','g'],['tbk','b']].forEach(([id,k])=>{const el=document.getElementById(id);
 el.addEventListener('pointerdown',e=>{tc[k]=1;e.preventDefault()});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>tc[k]=0))});

// minimappa
const mmc=document.getElementById('mmc'),mx=mmc.getContext('2d');
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;sp.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z)});
const ms=270/Math.max(maxX-minX,maxZ-minZ),mp=(x,z)=>[15+(x-minX)*ms,15+(z-minZ)*ms];
const mbg=document.createElement('canvas');mbg.width=mbg.height=300;{const g=mbg.getContext('2d');g.lineWidth=7;g.lineJoin='round';g.strokeStyle='#cfd3d8';g.beginPath();sp.forEach((p,i)=>{const[x,y]=mp(p.x,p.z);i?g.lineTo(x,y):g.moveTo(x,y)});g.closePath();g.stroke();
 const[sx,sy]=mp(sp[0].x,sp[0].z);g.fillStyle='#e10600';g.fillRect(sx-6,sy-6,12,12)}

const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const info=document.getElementById('info'),kmh=document.getElementById('kmh'),bt=document.getElementById('bt'),msg=document.getElementById('msg');
let last=performance.now()/1000;

function update(dt,now){
 const left=keys.ArrowLeft||keys.KeyA||tc.l,right=keys.ArrowRight||keys.KeyD||tc.r,gas=keys.ArrowUp||keys.KeyW||tc.g,brk=keys.ArrowDown||keys.KeyS||tc.b||keys.Space;
 if(st.mode==='count'){const t=st.sel?0:now-st.t0,n=Math.min(5,Math.floor(t/.9));
  for(let i=0;i<5;i++)LT[i].material.color.set(i<n?0xff1a1a:0x330000);
  if(n>st.ln){st.ln=n;beep(520,.15,.2)}
  if(t>5.6){st.mode='race';st.lapStart=st.raceStart=now;bt.textContent='VIA!';beep(900,.6,.25);LT.forEach(l=>l.material.color.set(0x330000))}}
 if(st.mode==='race'&&bt.textContent&&now-st.lapStart>0.8)bt.textContent='';
 if(st.mode==='race'){
  if(st.pit){st.v=0;if(now>=st.pit){cars[0].dmg=0;st.pit=0;bt.textContent='';msg.innerHTML=''}else{bt.textContent=(st.pit-now).toFixed(1);msg.innerHTML='🔧 BOX · riparazione in corso'}}
  else if(window.PM&&Math.hypot(st.pos.x-PM.x,st.pos.z-PM.z)<3.5&&Math.abs(st.v)<2.5)st.pit=now+2+(cars[0].dmg||0)*.04;
  if(gas&&!st.pit)st.v+=cars[0].acc*WG*(1-st.v/(cars[0].vm*(1-.45*(cars[0].dmg||0)/100)))*dt;else st.v-=st.v*.16*dt;if(st.nos&&now<st.nos&&!st.pit)st.v+=(88.9-st.v)*Math.min(1,dt*1.8);
  if(brk){st.v-=(st.v>0?60:20)*dt;if(st.v<-8)st.v=-8}
  const p0=sp[st.idx],dx0=st.pos.x-p0.x,dz0=st.pos.z-p0.z,o0=dx0*nor[st.idx].x+dz0*nor[st.idx].z;
  if(Math.abs(o0)>W+1.3){st.v-=st.v*1.6*dt}
  const sr=2.6/(1+Math.abs(st.v)/30)*Math.min(1,Math.abs(st.v)/6)*Math.sign(st.v)*(.55+.45*WG);
  st.str=(left?1:0)-(right?1:0);st.h+=st.str*sr*dt;{const D=cars[0].dmg||0;if(D>25)st.h+=Math.sign(Math.sin(cars[0].ph))*(D-25)/75*.35*Math.min(1,Math.abs(st.v)/30)*dt}
  st.pos.x+=Math.sin(st.h)*st.v*dt;st.pos.z+=Math.cos(st.h)*st.v*dt;
  // posizione sul tracciato
  let b=st.idx,bd=1e12;for(let k=-20;k<=20;k++){const i=(st.idx+k+N)%N,p=sp[i],d=(p.x-st.pos.x)**2+(p.z-st.pos.z)**2;if(d<bd){bd=d;b=i}}
  let dl=b-st.idx;if(dl>N/2)dl-=N;if(dl<-N/2)dl+=N;st.prog+=dl;st.idx=b;
  const p=sp[b],n=nor[b],o=(st.pos.x-p.x)*n.x+(st.pos.z-p.z)*n.z;
  const bq=((b-PO)%N+N)%N,bi=bq>N/2?bq-N:bq;if(bi<-19||bi>3)st.lane=false;const inE=bi>=-19&&bi<=-16,inX=bi>=-2&&bi<=3;
  const QS=-PSd,oq=o*QS;if(inE&&oq<-(GR+.3))st.lane=true;if(oq>-(GR-.3))st.lane=false;
  let lo=-WALL,hi=WALL;if(st.lane){lo=inX?-(WALL+(GR+6.2-WALL)*Math.max(0,(3-bi)/5)):-(GR+6.2);if(!inE&&!inX)hi=-(GR+.9);if(st.v>16.7)st.v-=(st.v-16.7)*Math.min(1,dt*4)}else if(inE)lo=-(GR+6.2);
  if(oq<lo||oq>hi){const s=(oq<lo?-1:1)*QS,ex=Math.abs(oq-(oq<lo?lo:hi));st.pos.x-=n.x*s*ex;st.pos.z-=n.z*s*ex;
   const into=(Math.sin(st.h)*n.x+Math.cos(st.h)*n.z)*s;
   if(into>0){st.v*=1-Math.min(.9,into*1.2*Math.min(1,dt*30));st.h+=wrap(Math.atan2(tan[b].x,tan[b].z)-st.h)*Math.min(1,4*dt)}}
  if(st.prog>=N){const lt=now-st.lapStart;st.best=Math.min(st.best,lt);PROGB(lt);if(AMB)AMB.boost=1;st.total+=lt;st.prog-=N;st.lapStart=now;st.lap++;st.done++;beep(880,.12);
   if(st.lap>LAPS){st.mode='done';st.lap=LAPS;finish(now)}}
 }
}
function frame(){
 const now=performance.now()/1000-PT,dt=Math.min(.05,now-last);last=now;if(!st.paused){update(dt,now);
 updRace(dt,now);ambient(dt);f2Hazards(dt,now);if(window.animCrowd)animCrowd(now)}
 st.ch=st.ch==null?st.h:st.ch;st.ch+=wrap(st.h-st.ch)*Math.min(1,dt*10);
 const f=new THREE.Vector3(Math.sin(st.h),0,Math.cos(st.h)),fc=new THREE.Vector3(Math.sin(st.ch),0,Math.cos(st.ch)),gy=sp[st.idx].y,V=st.view;
 if(V===0){st.cam.set(st.pos.x-fc.x*6.3,gy+2.5,st.pos.z-fc.z*6.3);cam.position.copy(st.cam);cam.lookAt(st.pos.x+f.x*9,gy+1.1,st.pos.z+f.z*9)}
 else{const cm=cars[0].m.userData.cam||{d:-.05,y:1.38,x:0},lx=Math.cos(st.h),lz=-Math.sin(st.h);st.cam.set(st.pos.x+f.x*cm.d+lx*cm.x,gy+cm.y,st.pos.z+f.z*cm.d+lz*cm.x);cam.position.copy(st.cam);cam.lookAt(st.cam.x+f.x*30,gy+cm.y-.4,st.cam.z+f.z*30)}
 const cu=cars[0].m.userData;cu.h.visible=V!==1;cu.sw.visible=V===1;if(cu.cab)cu.cab.visible=V===1;if(V===1&&cu.gauge&&((st.gf=(st.gf||0)+1)%2===0)){drawGauge(cu.gauge.ctx,Math.abs(st.v)*3.6,cars[0].vm*3.6);cu.gauge.tex.needsUpdate=true}st.sa=(st.sa||0)+((st.str||0)-(st.sa||0))*Math.min(1,dt*10);cu.sw.rotation.z=-st.sa*1.4;
 if(shk>0){cam.position.x+=(Math.random()-.5)*shk*.3;cam.position.y+=(Math.random()-.5)*shk*.3;shk=Math.max(0,shk-dt*2.5)}cam.near=V?.06:.5;cam.fov=V?78:65;if(st.nos&&now<st.nos)cam.fov+=12;cam.updateProjectionMatrix();
 updRain(dt,cam.position.x,cam.position.y,cam.position.z);fl=Math.max(0,fl-dt*3);if(WX.rain>1&&Math.random()<dt*.12)fl=1;hemi.intensity=WX.h+fl*1.3;
 R.render(scene,cam);
 kmh.textContent=Math.round(Math.abs(st.v)*3.6);
 const cur=st.mode==='race'?now-st.lapStart:0;
 info.innerHTML='Pos <b>P'+st.rk+'/'+NT+'</b> · Giro <b>'+st.lap+'/'+LAPS+'</b><br>Tempo '+fmt(cur)+'<br>Migliore '+fmt(st.best)+(GM==='tt'?'<br>Record <b>'+fmt(ttBest())+'</b>':'')+(GM==='champ'&&CH?'<br>Campionato · gara '+(CH.round+1)+'/'+CH.rounds.length:'')+'<br>Danni <b style="color:'+((cars[0].dmg||0)>60?'#ff4040':(cars[0].dmg||0)>25?'#ffb020':'#7CFF8A')+'">'+Math.round(cars[0].dmg||0)+'%</b>';
 mx.clearRect(0,0,300,300);mx.drawImage(mbg,0,0);const[px,py]=mp(st.pos.x,st.pos.z);mx.fillStyle='#ffd400';mx.beginPath();mx.arc(px,py,8,0,7);mx.fill();
 requestAnimationFrame(frame)}
frame();
};

<script>
(async()=>{const TO=(p,ms)=>Promise.race([Promise.resolve(p),new Promise(r=>setTimeout(()=>r(null),ms))]);
 const A={me:null,user:null,db:null,cfg:{},prog:null};
 try{for(let k=0;k<10&&!(window.claude&&window.claude.use);k++)await new Promise(r=>setTimeout(r,100));
  if(window.claude&&window.claude.use){A.user=await TO(claude.use('user'),3000);if(A.user)A.me=await TO(A.user.me(),3000);
   A.db=await TO(claude.use('db'),3000);
   if(A.db){
    if(A.me&&A.me.id)try{const sp=await TO(A.db.doc('data/users/'+A.me.id+'/progress').get(),3000);if(sp&&sp.exists)A.prog=sp.data()}catch(e){}
    if(A.me&&A.me.id)try{const sc=await TO(A.db.doc('data/users/'+A.me.id+'/circuits').get(),3000);if(sc&&sc.exists){const d=sc.data();if(d&&d.json&&!localStorage.getItem('f1sgr_circs'))localStorage.setItem('f1sgr_circs',d.json)}}catch(e){}}}}catch(e){}
 if(!A.prog){try{A.prog=JSON.parse(localStorage.getItem('f1sgr')||'null')}catch(e){}}
 window.AUTH=A;try{window.__main(A.cfg||{},A)}catch(e){console.error(e);const l=document.getElementById('ld');if(l)l.textContent='Errore di avvio: '+e.message}})();
</script></body></html>
