const EN_D=[["Ottimo! Dopo il check-in: urine ed emocromi vanno al Pathfinder, micro nel recipiente MICRO, gli altri in centrifuga. Se il PC segnala un problema sulla provetta, chiami il reparto giusto.", "Great! After check-in: urine and blood counts go to the Pathfinder, micro to the MICRO container, the rest to the centrifuge. If the PC flags a problem with the tube, call the right ward."], ["Frecce/WASD per muoverti, MAIUSC per correre, E per interagire, F per colpire, Esc pausa, M audio. Su touch: D-pad, RUN, E e HIT.", "Arrows/WASD to move, SHIFT to run, E to interact, F to hit, Esc pause, M audio. On touch: D-pad, RUN, E and HIT."], ["In alto: orario, STRESS (scende col caffè) ed ENERGIA (si recupera solo dormendo sul divano della sala caffè).", "Top: clock, STRESS (drops with coffee) and ENERGY (recovers only by sleeping on the coffee room sofa)."], ["Ogni tot EXP sali di grado e sblocchi nuovi reparti: il giorno dopo lavorerai nella nuova area. Buon lavoro!", "Every so much EXP you rank up and unlock new departments: the next day you work in the new area. Good luck!"], ["Il controllo qualità era fuori range: i risultati potrebbero essere aberranti. Che fai?", "The quality control was out of range: results may be aberrant. What do you do?"], ["Buongiorno! Ho campioni da smistare e ritiro quelli da spedire verso gli altri presidi.", "Good morning! I have samples to sort and I pick up those to ship to the other sites."], ["EMOCOLTURA POSITIVA! Preleva i flaconi positivi e portali subito al recipiente MICRO.", "POSITIVE BLOOD CULTURE! Take the positive bottles to the MICRO container now."], ["Iscriviti a questo bot: guadagni soldi virtuali! Se usi il mio link guadagno pure io!", "Sign up to this bot: you earn virtual money! If you use my link I earn too!"], ["Mi serve il modulo 27-B con timbro, in triplice copia, e la verifica della verifica.", "I need form 27-B with a stamp, in triplicate, and the verification of the verification."], ["Il campione risulta INDEFINITO: la curva molecolare non è interpretabile. Che fai?", "The sample is UNDEFINED: the molecular curve cannot be interpreted. What do you do?"], ["Una domanda velocissima: se lavo il pavimento due volte, diventa doppio pavimento?", "A very quick question: if I mop the floor twice, does it become a double floor?"], ["Qui in micro abbiamo il futuro: sequenziatori, intelligenza artificiale, robot...", "Here in micro we have the future: sequencers, artificial intelligence, robots..."], ["Prima di tutto controlli di qualità e doppia verifica. La perfezione non aspetta.", "First of all quality controls and double checks. Perfection doesn't wait."], ["Prendi la provetta di AMMONIO in ghiaccio: portala SUBITO allo strumento CHIMICA", "Take the AMMONIA tube on ice: bring it to the CHEMISTRY instrument NOW"], ["Scassio vuole urgenza, Marruno qualità, Difermo moduli: scegli chi accontentare!", "Scassio wants urgency, Marruno quality, Difermo forms: choose who to please!"], ["Classifica non disponibile: apri il gioco dal link condiviso (serve l'accesso).", "Leaderboard unavailable: open the game from the shared link (login required)."], ["! Sei il nuovo tecnico: tra campioni, telefoni e colleghi il caos è garantito.", "! You are the new technician: between samples, phones and colleagues, chaos is guaranteed."], ["Io rimango fuori dalle lamentele. Ma ho i capelli come il lavoro: ingestibili.", "I stay out of the complaining. But my hair is like my work: unmanageable."], [": curva di amplificazione regolare, Ct nel range, controllo interno valido → ", ": regular amplification curve, Ct in range, internal control valid → "], ["Consegnati dopo le 9:30: per la biologia molecolare vanno rimandati indietro.", "Delivered after 9:30: for molecular biology they must be sent back."], ["A che punto siamo? Non voglio metterti ansia, ma sto prendendo nota di tutto.", "Where are we at? I don't want to stress you, but I'm taking notes on everything."], ["Noi siamo all'avanguardia. Gli altri reparti sono, diciamo, più tradizionali.", "We are cutting-edge. The other departments are, let's say, more traditional."], ["Gentilissim{o}, ho un'altra chiamata in corso: ti richiamo io! Un attimino...", "Dear, I have another call in progress: I'll call you back! Just a moment..."], ["Guarda che foto: la mia macchina nuova! Cerchi in lega, scarichi sportivi...", "Look at this photo: my new car! Alloy wheels, sport exhausts..."], ["Scusa, hai visto i campioni di autoimmunità? Quelli con le etichette ricce?", "Sorry, have you seen the autoimmunity samples? The ones with the curly labels?"], ["Vecchio salvataggio: progressi e sblocchi conservati, riparti dal giorno ", "Old save: progress and unlocks kept, restart from day "], ["URGENTISSIMO! Tutto è urgentissimo! Prima i miei campioni, poi gli altri!", "SUPER URGENT! Everything is super urgent! My samples first, then the others!"], ["Nessun campione da registrare. Vuoi navigare online per staccare un po'?", "No sample to register. Want to browse online to unwind?"], [" piastre dal termostato: leggile sotto cappa con il dirigente dalle 9:00", " plates from the incubator: read them under the hood with the manager from 9:00"], ["Mi serve un aggiornamento preciso. E quando dico preciso intendo adesso.", "I need a precise update. And when I say precise I mean right now."], ["Oggi vuoi lavorare con Carucci? Se no ti affiancherà un tecnico a caso.", "Do you want to work with Carucci today? If not, a random technician will join you."], ["Nessun risultato da validare. Vuoi navigare online per staccare un po'?", "No result to validate. Want to browse online to unwind?"], ["Hai sentito? Arriva uno strumento che fa tutto da solo. Un'innovazione!", "Did you hear? An instrument that does everything by itself is coming. An innovation!"], ["Pacco per il laboratorio! Sono... 38 colli. Firma qui, qui, qui e qui.", "Parcel for the lab! It's... 38 packages. Sign here, here, here and here."], ["Urgenza in arrivo! Ti mando subito un carrier nella posta pneumatica.", "Emergency incoming! I'm sending a carrier in the pneumatic post now."], ["Niente da centrifugare: emocromi, urine e micro non si centrifugano.", "Nothing to centrifuge: blood counts, urine and micro are not centrifuged."], ["Reagenti esauriti: prendili dal frigorifero e preparali sul bancone.", "Reagents depleted: take them from the fridge and prepare them on the bench."], ["Calprotectina: prepara prima i campioni fecali al bancone centrale (", "Calprotectin: first prepare the faecal samples at the central bench ("], ["Oggi si esegue la CALPROTECTINA: tanti campioni fecali da preparare!", "Today we run CALPROTECTIN: lots of faecal samples to prepare!"], [": curva con plateau basso e Ct tardivo (>38): dubbia. Controllo ok.", ": curve with low plateau and late Ct (>38): doubtful. Control ok."], ["TAMPONE POSITIVO (BiTi Mas): chiama subito il reparto dal telefono!", "POSITIVE SWAB (BiTi Mas): call the ward from the phone now!"], ["Ai miei tempi gli strumenti non si guastavano. Si lamentavano meno.", "In my day instruments didn't break down. They complained less."], ["Pronto soccorso: ok, controlliamo cosa mettiamo nella posta. Forse.", "Emergency room: ok, we'll check what we put in the post. Maybe."], ["Nessuna urgenza: recupera i campioni dalla finestra o dalla posta.", "No urgent samples: collect them from the hatch or the post."], ["Le piastre si leggono sotto cappa insieme al dirigente dalle 9:00.", "Plates are read under the hood with the manager from 9:00."], ["(al telefono) Sì, certo, un attimo... Ciao caro, scusa un secondo!", "(on the phone) Yes, sure, one moment... Hi dear, sorry one second!"], ["La qualità prima di tutto: ogni referto va ricontrollato. Allora?", "Quality first: every report must be rechecked. So?"], ["Il sensore suona ma la tanica è quasi vuota: prova un calcio (F)!", "The sensor beeps but the tank is almost empty: try a kick (F)!"], ["Il nostro reparto è pieno di tecnologia sofisticata. Chiedi pure!", "Our department is full of sophisticated technology. Ask away!"], ["Che gentile che sei! Scusa, ho una chiamata... anzi due chiamate.", "How kind you are! Sorry, I have a call... make that two calls."], ["Scusi, giovane... sa dov'è l'uscita dell'ospedale? Mi sono perso.", "Excuse me, young one... do you know where the hospital exit is? I'm lost."], ["Ti ricordo che le divise sono ancora sul letto. Ancora sul letto!", "Reminder: the uniforms are still on the bed. Still on the bed!"], ["Serve il modulo 27-B, timbrato, in triplice copia, con verifica.", "Form 27-B is needed, stamped, in triplicate, with verification."], ["Frigo reattivi: gli strumenti non hanno bisogno di reagenti ora.", "Reagent fridge: the instruments don't need reagents now."], ["Centrifugazione finita: ritira le provette (vanno al Pathfinder)", "Centrifuging done: collect the tubes (they go to the Pathfinder)"], ["Ho vinto un terno al bingo parrocchiale, ma non dirlo a nessuno.", "I won a trio at the parish bingo, but don't tell anyone."], ["Pettegolezzo: dicono che il primario abbia cambiato parrucchino.", "Gossip: they say the chief physician changed his toupee."], ["Bolla registrata: i reparti ritirano le scorte, scaffale libero", "Delivery note registered: wards collect supplies, shelf free"], ["Che maleducato! Con questi modi nessuno ti inviterà più a cena.", "How rude! With manners like these nobody will invite you to dinner again."], ["Sai l'ultima? Il reparto di sopra ha finito il caffè. Scandalo!", "Have you heard? The ward upstairs ran out of coffee. Scandal!"], ["Ho letto un aggiornamento rivoluzionario: cambia tutto. Ancora.", "I read a revolutionary update: everything changes. Again."], [" campioni micro: portali al banco di raccolta in microbiologia", " micro samples: bring them to the collection bench in microbiology"], ["Nessun campione sul banco: aspetta o controlla l'accettazione.", "No sample on the bench: wait or check reception."], ["Sei al PC della scrivania dei dirigenti. Vuoi navigare online?", "You are at the managers' desk PC. Browse online?"], ["Chiami l'assistenza: il tecnico in giacca e cravatta arriva...", "You call support: the technician in a suit and tie is coming..."], ["Reparto avvisato: isolamento attivato per il paziente positivo", "Ward notified: isolation activated for the positive patient"], ["Ammonio non processato in tempo: campione da rifare! -25 punti", "Ammonia not processed in time: sample must be redone! -25 points"], ["Ancora una conferma... e se fosse un errore? Ultimo controllo.", "One more confirmation... what if it were an error? Last check."], ["Di notte e di domenica non serve: usa il PC della sala caffè.", "Not needed at night and on Sunday: use the coffee room PC."], ["Nessun campione da registrare: prima controllalo al vassoio.", "No sample to register: check it at the tray first."], ["URGENTISSIMO! Voglio tutto subito, anzi ieri! Cosa rispondi?", "SUPER URGENT! I want everything now, make that yesterday! What do you answer?"], ["Hai visto che bella ragazza è entrata? Ma che dico, una dea!", "Did you see the beautiful girl who just walked in? What am I saying, a goddess!"], ["Strumento da preparare: prendi il reattivo dal frigorifero.", "Instrument needs setup: take the reagent from the fridge."], ["Bancone centrale: prima prendi un reattivo dal frigorifero.", "Central bench: first take a reagent from the fridge."], ["Ricorda: la precisione prima di tutto. Ti aiuto volentieri.", "Remember: precision above all. I'm happy to help."], [" campioni (non si centrifugano e non vanno sul Pathfinder).", " samples (not centrifuged, they don't go on the Pathfinder)."], ["Urine: si sblocca smistando 5 provette col Pathfinder (D1)", "Urine: unlocks by sorting 5 tubes with the Pathfinder (D1)"], ["Salti il QC: risparmi tempo, ma rischi risultati aberranti", "You skip QC: you save time, but risk aberrant results"], ["L'autoimmunità ci porta via la vita. E nessuno ci ascolta.", "Autoimmunity is taking our lives. And nobody l
